<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <link id="card-style" rel="stylesheet" href="card.css">
    <title>Physical Name Card</title>

    <style>
.middle-decoration {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
}


/* =========================
   DOT PATTERN
   ========================= */

.dot-pattern {
    position: absolute;

    left: 44%;
    top: 23%;

    width: 145px;
    height: 120px;

    background-image: radial-gradient(
        rgba(0, 0, 0, 0.22) 1.2px,
        transparent 1.2px
    );

    background-size: 12px 12px;

    opacity: 0.55;

    mask-image: linear-gradient(
        to right,
        transparent,
        black 15%,
        black 85%,
        transparent
    );
}


/* =========================
   OUTLINE POLYGON
   ========================= */

.outline-polygon {
    position: absolute;

    left: 39%;
    top: 10%;

    width: 350px;
    height: 280px;

    border: 1px solid rgba(0, 0, 0, 0.13);

    clip-path: polygon(
        35% 0%,
        100% 0%,
        72% 50%,
        100% 100%,
        25% 100%,
        55% 50%
    );

    opacity: 0.9;
}


/* =========================
   FLOWING LINES
   ========================= */

.middle-lines {
    position: absolute;

    left: 42%;
    top: 0;

    width: 280px;
    height: 100%;
}

.middle-lines span {
    height: 1px;

    background: rgba(0, 0, 0, 0.16);

    transform: rotate(-28deg);
}

.middle-lines span:nth-child(1) {
    top: 42%;
    left: 0;
    width: 220px;
}

.middle-lines span:nth-child(2) {
    top: 50%;
    left: 25px;
    width: 250px;
}

.middle-lines span:nth-child(3) {
    top: 58%;
    left: 55px;
    width: 190px;
}
    </style>

</head>


<body>


    <div class="card">

        <!-- Decorative side -->
        <div class="accent"></div>


        <!-- Company logo -->
        <img
            src="gatsystem_logo.jpg"
            class="logo"
            alt="Company Logo"
        >


        <!-- Company -->
        <div
            class="company"
            id="company"
        ></div>


        <!-- Name -->
        <div
            class="name"
            id="name"
        ></div>


        <!-- Position -->
        <div
            class="position"
            id="position"
        ></div>


        <!-- NFC -->
        <div class="nfc-label">

            <span class="nfc-icon">◉</span>

            TAP TO CONNECT

        </div>

        <div class="flow-1"></div>
        <div class="flow-2"></div>
        <div class="flow-3"></div>

        <img
            src="image_copy.png"
            alt="Profile Photo"
            class="card-photo"
        >

        <div class="right-shape">

            <div class="right-blue-1"></div>
            <div class="right-blue-2"></div>
            <div class="right-blue-3"></div>
            <div class="right-blue-4"></div>
            <div class="right-blue-5"></div>
            <div class="right-blue-6"></div>

        </div>

        <div class="middle-decoration">

            <div class="dot-pattern"></div>

            <div class="outline-polygon"></div>

            <div class="middle-lines">
                <span></span>
                <span></span>
                <span></span>
            </div>

        </div>

    </div>


    <script>

        async function loadUser() {

            const params =
                new URLSearchParams(
                    window.location.search
                );

            const userId =
                params.get("id");


            try {

                const response =
                    await fetch("users.json");


                const users =
                    await response.json();


                let user;


                if (userId) {

                    user =
                        users.find(
                            u => u.id === userId
                        );

                } else {

                    user =
                        users[0];

                }


                if (!user) {

                    document.querySelector(".card").innerHTML = `
                        <h2>User Not Found</h2>
                    `;

                    return;

                }


                /* =================================
                SELECT CARD DESIGN
                ================================= */

                const cardStyle =
                    document.getElementById("card-style");


                if (user.id === "001") {

                    cardStyle.href = "card.css";

                }
                else if (user.id === "002") {

                    cardStyle.href = "card2.css";

                }
                else if (user.id === "003") {

                    cardStyle.href = "card3.css";

                }


                /* =================================
                LOAD USER INFORMATION
                ================================= */

                document.getElementById("company")
                    .textContent =
                    user.company || "";


                document.getElementById("name")
                    .textContent =
                    user.name || "";


                document.getElementById("position")
                    .textContent =
                    user.position || "";


            }

            catch (error) {

                console.error(
                    "Error loading users.json:",
                    error
                );

            }

        }


        loadUser();

    </script>


</body>

</html>

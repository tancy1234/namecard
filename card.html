<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <link id="card-style" rel="stylesheet" href="card.css">
    <title>Physical Name Card</title>

</head>


<body>


    <div class="card">

        <!-- Decorative side -->
        <div class="accent"></div>


        <!-- Company logo -->
        <img
            src="gatsystem_logo.jpg"
            class="logo"
            alt="Company Logo"
        >


        <!-- Company -->
        <div
            class="company"
            id="company"
        ></div>


        <!-- Name -->
        <div
            class="name"
            id="name"
        ></div>


        <!-- Position -->
        <div
            class="position"
            id="position"
        ></div>


        <!-- NFC -->
        <div class="nfc-label">

            <span class="nfc-icon">◉</span>

            TAP TO CONNECT

        </div>

        <div class="flow-1"></div>
        <div class="flow-2"></div>
        <div class="flow-3"></div>

        <div class="right-shape">

            <div class="right-blue-1"></div>
            <div class="right-blue-2"></div>
            <div class="right-blue-3"></div>
            <div class="right-blue-4"></div>
            <div class="right-blue-5"></div>
            <div class="right-blue-6"></div>

        </div>


    </div>


    <script>

        async function loadUser() {

            const params =
                new URLSearchParams(
                    window.location.search
                );

            const userId =
                params.get("id");


            try {

                const response =
                    await fetch("users.json");


                const users =
                    await response.json();


                let user;


                if (userId) {

                    user =
                        users.find(
                            u => u.id === userId
                        );

                } else {

                    user =
                        users[0];

                }


                if (!user) {

                    document.querySelector(".card").innerHTML = `
                        <h2>User Not Found</h2>
                    `;

                    return;

                }


                /* =================================
                SELECT CARD DESIGN
                ================================= */

                const cardStyle =
                    document.getElementById("card-style");


                if (user.id === "001") {

                    cardStyle.href = "card.css";

                }
                else if (user.id === "002") {

                    cardStyle.href = "card2.css";

                }
                else if (user.id === "003") {

                    cardStyle.href = "card3.css";

                }


                /* =================================
                LOAD USER INFORMATION
                ================================= */

                document.getElementById("company")
                    .textContent =
                    user.company || "";


                document.getElementById("name")
                    .textContent =
                    user.name || "";


                document.getElementById("position")
                    .textContent =
                    user.position || "";


            }

            catch (error) {

                console.error(
                    "Error loading users.json:",
                    error
                );

            }

        }


        loadUser();

    </script>


</body>

</html>
